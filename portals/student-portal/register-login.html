<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khensani AI · Sign In</title>
  <link rel="icon" href="https://i.postimg.cc/RVnfKspQ/Khensani-Transparent-Logo.png" />
  <link rel="stylesheet" href="/assets/css/particles.css" />
  <link rel="stylesheet" href="/assets/css/splash.css" />
  <link rel="stylesheet" href="/assets/css/branding.css" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
</head>
<body>

  <!-- SPLASH -->
  <div id="khensani-splash">
    <img src="https://i.postimg.cc/RVnfKspQ/Khensani-Transparent-Logo.png" alt="" class="splash-logo" />
    <div class="splash-tagline">Quantum-Powered Educational Ecosystem</div>
    <div class="splash-loader">
      <img src="https://i.postimg.cc/T3ytnBqN/KD-LOGO-IMAGE-removebg-preview.png" alt="" class="kd-rotation" />
    </div>
  </div>

  <div id="particles-js"></div>

  <main class="auth-shell">
    <header class="auth-header">
      <img src="https://i.postimg.cc/RVnfKspQ/Khensani-Transparent-Logo.png" alt="Khensani AI" class="auth-logo" />
      <h1>Welcome to Khensani AI</h1>
      <p class="auth-sub">Quantum-powered educational ecosystem</p>
    </header>

    <!-- STEP 1: Sign in -->
    <section id="step-signin" class="auth-step active">
      <button id="google-signin" class="btn btn-google">
        <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
      <button id="email-signin" class="btn btn-outline">Sign in with Email</button>
      <button id="qr-signin" class="btn btn-outline">📱 Scan School QR Code</button>
    </section>

    <!-- STEP 2: Role selection (first-time) -->
    <section id="step-role" class="auth-step">
      <h2>Who are you?</h2>
      <div class="role-grid">
        <button class="role-card" data-role="student">🎓<span>Student</span></button>
        <button class="role-card" data-role="teacher">👩‍🏫<span>Teacher</span></button>
        <button class="role-card" data-role="parent">👨‍👩‍👧<span>Parent</span></button>
        <button class="role-card" data-role="hod">📊<span>Head of Department</span></button>
        <button class="role-card" data-role="principal">🏫<span>Principal</span></button>
        <button class="role-card" data-role="security">🛡️<span>Security</span></button>
        <button class="role-card" data-role="corporate">💼<span>Corporate</span></button>
      </div>
    </section>

    <!-- DEMO MODE -->
    <section class="demo-section">
      <p class="demo-label">Try a Demo</p>
      <div class="demo-buttons">
        <button class="demo-btn" data-demo="student">Student</button>
        <button class="demo-btn" data-demo="teacher">Teacher</button>
        <button class="demo-btn" data-demo="parent">Parent</button>
        <button class="demo-btn" data-demo="principal">Principal</button>
        <button class="demo-btn" data-demo="security">Security</button>
      </div>
    </section>

    <footer class="auth-footer">
      <span data-brand="copyright">© 2026 MindTech Industries · Quantum AI Division</span>
      <span data-brand="patent">SA 2026/05142</span>
    </footer>
  </main>

  <!-- QR Modal -->
  <div id="qr-modal" class="qr-modal" aria-hidden="true">
    <div class="qr-modal-content">
      <h3>Scan your school QR code</h3>
      <video id="qr-video" autoplay playsinline></video>
      <canvas id="qr-canvas" hidden></canvas>
      <button id="qr-close" class="btn btn-outline">Cancel</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-functions-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

  <!-- Particles -->
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script src="/assets/js/particles-config.js"></script>

  <!-- Core -->
  <script src="/assets/js/firebase-config.js"></script>
  <script src="/assets/js/branding.js"></script>
  <script src="/assets/js/splash.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/auth-manager.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    (async function () {
      'use strict';

      await window.KhensaniAuth.init();

      const showStep = (id) => {
        document.querySelectorAll('.auth-step').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
      };

      // === Google Sign In ===
      document.getElementById('google-signin').onclick = async () => {
        try {
          const result = await window.KhensaniAuth.signInWithGoogle();
          if (result.needsRole) return showStep('step-role');
          window.KhensaniAuth.redirectToPortal(result.role);
        } catch (err) {
          alert('Sign in failed: ' + err.message);
        }
      };

      // === Email fallback (prompt-based for brevity — replace with form) ===
      document.getElementById('email-signin').onclick = async () => {
        const email = prompt('Email:');
        const password = prompt('Password:');
        if (!email || !password) return;
        try {
          const result = await window.KhensaniAuth.signInWithEmail(email, password);
          if (!result.role) return showStep('step-role');
          window.KhensaniAuth.redirectToPortal(result.role);
        } catch (err) { alert(err.message); }
      };

      // === Role Selection ===
      document.querySelectorAll('.role-card').forEach(btn => {
        btn.onclick = async () => {
          const role = btn.dataset.role;
          await window.KhensaniAuth.setRole(role);
          window.KhensaniAuth.redirectToPortal(role);
        };
      });

      // === Demo Mode ===
      document.querySelectorAll('.demo-btn').forEach(btn => {
        btn.onclick = () => window.KhensaniAuth.enterDemo(btn.dataset.demo);
      });

      // === QR Login ===
      const qrModal = document.getElementById('qr-modal');
      const qrVideo = document.getElementById('qr-video');
      const qrCanvas = document.getElementById('qr-canvas');
      let qrStream = null;

      document.getElementById('qr-signin').onclick = async () => {
        qrModal.setAttribute('aria-hidden', 'false');
        try {
          qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          qrVideo.srcObject = qrStream;
          scanQR();
        } catch (e) { alert('Camera unavailable'); qrModal.setAttribute('aria-hidden', 'true'); }
      };

      document.getElementById('qr-close').onclick = () => {
        qrStream?.getTracks().forEach(t => t.stop());
        qrModal.setAttribute('aria-hidden', 'true');
      };

      function scanQR() {
        const ctx = qrCanvas.getContext('2d');
        const tick = () => {
          if (qrVideo.readyState === qrVideo.HAVE_ENOUGH_DATA) {
            qrCanvas.width = qrVideo.videoWidth;
            qrCanvas.height = qrVideo.videoHeight;
            ctx.drawImage(qrVideo, 0, 0);
            const img = ctx.getImageData(0, 0, qrCanvas.width, qrCanvas.height);
            const code = window.jsQR(img.data, img.width, img.height);
            if (code) {
              qrStream.getTracks().forEach(t => t.stop());
              const token = new URL(code.data).searchParams.get('token') || code.data;
              window.KhensaniAuth.signInWithQRToken(token)
                .then(r => window.KhensaniAuth.redirectToPortal(r.role))
                .catch(e => alert('QR login failed: ' + e.message));
              return;
            }
          }
          requestAnimationFrame(tick);
        };
        tick();
      }
    })();
  </script>
</body>
</html>
