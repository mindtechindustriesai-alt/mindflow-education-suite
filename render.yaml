services:
  - type: web
    name: khensani-ai
    runtime: static
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build --if-present
    staticPublishPath: ./
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /
        destination: /index.html
      - type: rewrite
        source: /login
        destination: /index.html
      - type: rewrite
        source: /student/*
        destination: /student-portal/:splat
      - type: rewrite
        source: /teacher/*
        destination: /teacher-portal/:splat
      - type: rewrite
        source: /parent/*
        destination: /parent/:splat
      - type: rewrite
        source: /hod/*
        destination: /hod-portal/:splat
      - type: rewrite
        source: /principal/*
        destination: /principal-portal/:splat
      - type: rewrite
        source: /corporate/*
        destination: /corporate-portal/:splat
      - type: rewrite
        source: /security/*
        destination: /security-portal/:splat
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(self), geolocation=(self)"
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self' 'unsafe-inline' 'unsafe-eval'
            https://www.gstatic.com
            https://cdn.jsdelivr.net
            https://unpkg.com
            https://cdnjs.cloudflare.com;
          style-src 'self' 'unsafe-inline'
            https://fonts.googleapis.com
            https://unpkg.com;
          font-src 'self'
            https://fonts.gstatic.com
            data:;
          img-src 'self' data: blob:
            https://i.postimg.cc
            https://*.tile.openstreetmap.org
            https://*.basemaps.cartocdn.com;
          connect-src 'self'
            https://*.googleapis.com
            https://*.firebaseio.com
            https://*.cloudfunctions.net
            https://*.run.app
            wss://*.firebaseio.com
            https://quantum-ai-z2wx.onrender.com
            https://api.open-meteo.com;
          frame-src 'self' https://*.firebaseapp.com;
          worker-src 'self' blob:;
          object-src 'none';
          base-uri 'self';
          form-action 'self'
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: mindflow-ai-education
      - key: FIREBASE_AUTH_DOMAIN
        value: mindflow-ai-education.firebaseapp.com
      - key: FIREBASE_STORAGE_BUCKET
        value: mindflow-ai-education.firebasestorage.app
      - key: FIREBASE_APP_ID
        value: "1:157615197603:web:540d67781fc55d04c11e16"
      - key: FIREBASE_API_KEY
        sync: false
      - key: IBM_QUANTUM_BACKEND
        value: ibm_kingston
      - key: IBM_QUANTUM_TOKEN
        sync: false
      - key: IBM_QUANTUM_CRN
        sync: false
      - key: AER_ENDPOINT
        value: https://quantum-ai-z2wx.onrender.com/api/chsh
      - key: CLOUD_FUNCTIONS_REGION
        value: africa-south1
      - key: DEFAULT_LOCALE
        value: en
      - key: SUPPORTED_LOCALES
        value: "en,fr,ar,sw,pt,zu,st,sn,xh,ha,am,yo,af"
      - key: SPLASH_DURATION_MS
        value: "3000"
      - key: SENTINEL_ENABLED
        value: "true"
      - key: QUANTUM_VERIFY_ENABLED
        value: "true"